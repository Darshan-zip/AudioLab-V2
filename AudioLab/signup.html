<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - AudioLab Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">🎵</div>
      <h2>Create Your Account</h2>

      <form action="http://localhost:5000/signup" method="POST" enctype="multipart/form-data">
        <div class="input-group">
          <input type="text" name="firstName" placeholder="First Name" required />
        </div>
        <div class="input-group">
          <input type="text" name="lastName" placeholder="Last Name" required />
        </div>
        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" name="password" placeholder="Password" required />
        </div>
        <div class="input-group">
          <input type="password" name="confirmPassword" placeholder="Re-enter Password" required />
        </div>
        <div class="input-group">
          <input type="text" name="genre" placeholder="Favorite Genre (e.g., Jazz, EDM)" />
        </div>
        <div class="input-group">
          <textarea name="bio" placeholder="Tell us about yourself" rows="3"></textarea>
        </div>
        <div class="input-group">
          <label style="font-size: 14px;">Profile Picture:</label><br/>
          <input type="file" name="profilePicture" accept="image/*" />
        </div>

        <button type="submit" class="login-btn">Sign Up →</button>
      </form>

      <p class="signup-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</body>
</html>
